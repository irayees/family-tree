<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Family Tree</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --line: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
      --male: #3b82f6;
      --male-bg: #eff6ff;
      --male-border: #bfdbfe;
      --female: #ec4899;
      --female-bg: #fdf2f8;
      --female-border: #fbcfe8;
      --accent: #2563eb;
      --accent-ring: rgba(37, 99, 235, 0.25);
      --match-bg: #fef9c3;
      --match-border: #eab308;
      --ok-bg: #ecfdf5;
      --ok-text: #047857;
      --ok-border: #a7f3d0;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.12);
      --radius: 10px;
      --zoom: 1;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* Password Lock Screen */
    #lockscreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at top, #eff6ff 0%, #f8fafc 65%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lock-card {
      width: 100%;
      max-width: 390px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      padding: 28px 26px 24px;
      text-align: center;
    }

    .lock-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 14px;
      border-radius: 12px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
    }

    .lock-card h1 {
      margin: 0 0 6px;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .lock-card p {
      margin: 0 0 20px;
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .lock-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pw-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .pw-wrap input {
      width: 100%;
      padding: 10px 64px 10px 13px;
      font-size: 0.95rem;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .pw-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-ring);
    }

    .pw-toggle {
      position: absolute;
      right: 8px;
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .pw-toggle:hover {
      background: var(--surface-alt);
      color: var(--text);
    }

    .btn-primary {
      appearance: none;
      background: var(--accent);
      color: #ffffff;
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-primary:active {
      transform: translateY(1px);
    }

    .lock-err {
      margin-top: 4px;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger);
      font-size: 0.82rem;
      font-weight: 600;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .shake {
      animation: shake 0.32s ease-in-out;
    }

    /* Main App Container */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 100vw;
      padding: 14px 18px;
      overflow: hidden;
    }

    #app.dragover .treewrap {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-ring);
    }

    /* Header Bar */
    header.bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px 16px;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }

    .title {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px 14px;
    }

    .title h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .stats {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--muted);
      white-space: nowrap;
    }

    .pill.ok {
      background: var(--ok-bg);
      color: var(--ok-text);
      border-color: var(--ok-border);
    }

    .pill.ok::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
    }

    /* Search Input */
    .search {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .search input {
      width: 200px;
      padding: 6px 64px 6px 11px;
      font-size: 0.85rem;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-ring);
    }

    .search .count {
      position: absolute;
      right: 8px;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--muted);
      pointer-events: none;
    }

    /* Buttons & Groups */
    .group {
      display: inline-flex;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-strong);
      background: var(--surface);
    }

    .group .btn {
      border: none;
      border-right: 1px solid var(--border);
      border-radius: 0;
    }

    .group .btn:last-child {
      border-right: none;
    }

    .btn {
      appearance: none;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 0.83rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s, transform 0.05s;
      line-height: 1.2;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--surface-alt);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .notice {
      margin: 8px 0 0;
      padding: 8px 12px;
      border-radius: 8px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      font-size: 0.84rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* Main Layout */
    .layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 14px;
      margin-top: 10px;
      flex: 1;
      min-height: 0;
    }

    /* Tree Viewport */
    .treewrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: auto;
      padding: 24px 28px 60px;
      position: relative;
      cursor: grab;
      user-select: none;
    }

    .treewrap.panning {
      cursor: grabbing;
    }

    #tree {
      transform: scale(var(--zoom));
      transform-origin: 0 0;
      transition: transform 0.12s ease-out;
      display: inline-block;
      min-width: 100%;
    }

    /* Tree Lists & Hierarchy Connectors */
    #tree ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    ul.roots > li.node {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px dashed var(--border);
    }

    ul.roots > li.node:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }

    ul.kids {
      margin-left: 26px !important;
      padding-left: 22px !important;
      border-left: 2px solid var(--line);
      margin-top: 8px !important;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    li.node {
      position: relative;
    }

    ul.kids > li.node::before {
      content: "";
      position: absolute;
      left: -22px;
      top: 19px;
      width: 18px;
      height: 2px;
      background: var(--line);
    }

    li.node.collapsed > ul.kids {
      display: none;
    }

    /* Unit & Couple Cards */
    .unit {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 3px 0;
    }

    .couple {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 8px;
      background: var(--surface-alt);
      padding: 4px 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .srow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .mlabel {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      padding: 0 2px;
      font-style: italic;
    }

    .mlabel.ended {
      color: #b45309;
      text-decoration: line-through;
    }

    .note {
      font-size: 0.73rem;
      color: var(--muted);
      background: var(--surface);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px dashed var(--border-strong);
    }

    /* Person Card Button */
    button.card {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: transform 0.1s, box-shadow 0.15s, border-color 0.15s, background 0.15s;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    button.card.m {
      background: var(--male-bg);
      border-color: var(--male-border);
    }

    button.card.f {
      background: var(--female-bg);
      border-color: var(--female-border);
    }

    button.card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    button.card.selected {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px var(--accent-ring), var(--shadow-md) !important;
    }

    button.card.match {
      background: var(--match-bg) !important;
      border-color: var(--match-border) !important;
      box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.35);
    }

    button.card.dead {
      opacity: 0.92;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--muted);
    }

    button.card.m .dot {
      background: var(--male);
    }

    button.card.f .dot {
      background: var(--female);
    }

    .nm {
      display: inline-flex;
      flex-direction: column;
      line-height: 1.25;
    }

    .nm small {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--muted);
      margin-top: 1px;
    }

    .dag {
      color: var(--muted);
      font-weight: 700;
      margin-left: 2px;
    }

    button.card.ref .nm::after {
      content: " ↗";
      display: contents;
      font-size: 0.75rem;
      color: var(--accent);
    }

    /* Branch Expand/Collapse Toggle */
    button.tog {
      appearance: none;
      min-width: 26px;
      height: 26px;
      padding: 0 7px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }

    button.tog:hover {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    button.tog[aria-expanded="false"] {
      background: #eff6ff;
      color: var(--accent);
      border-color: #93c5fd;
    }

    /* Details Aside Panel */
    aside.panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    aside.panel h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
    }

    aside.panel .guide {
      margin: 0;
      font-size: 0.87rem;
      line-height: 1.5;
      color: var(--muted);
    }

    .legend {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      border-radius: 8px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--text);
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .legend i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    /* Selected Person Panel View */
    .p-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .p-name {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .p-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .badge {
      font-size: 0.73rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .badge.m {
      background: var(--male-bg);
      color: #1d4ed8;
      border-color: var(--male-border);
    }

    .badge.f {
      background: var(--female-bg);
      color: #be185d;
      border-color: var(--female-border);
    }

    .p-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 12px;
      background: var(--surface-alt);
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.83rem;
    }

    .p-meta div {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .p-meta dt {
      color: var(--muted);
      font-weight: 500;
    }

    .p-meta dd {
      margin: 0;
      font-weight: 600;
      text-align: right;
    }

    .rel-sec {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rel-sec h3 {
      margin: 0;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .rel-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rel-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .rel-item button.card {
      width: 100%;
      justify-content: flex-start;
    }

    .rel-sub {
      font-size: 0.72rem;
      color: var(--muted);
      margin-left: auto;
      white-space: nowrap;
    }

    .empty-rel {
      font-size: 0.82rem;
      color: var(--muted);
      font-style: italic;
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      #app {
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }
      .layout {
        grid-template-columns: 1fr;
      }
      .treewrap {
        height: 62vh;
      }
      aside.panel {
        max-height: none;
      }
    }
  </style>
</head>
<body>

<!-- Password Lock Overlay -->
<div id="lockscreen" role="dialog" aria-modal="true" aria-labelledby="lock-title">
  <div class="lock-card" id="lock-card">
    <div class="lock-icon" aria-hidden="true">🔒</div>
    <h1 id="lock-title">My Family Tree</h1>
    <p>This family tree is password protected. Enter the password to view.</p>
    <form class="lock-form" id="lock-form">
      <div class="pw-wrap">
        <input
          id="pw-input"
          type="password"
          placeholder="Enter password"
          aria-label="Password"
          autocomplete="current-password"
          required
          autofocus
        />
        <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">Show</button>
      </div>
      <button type="submit" class="btn-primary">Unlock Family Tree</button>
      <div class="lock-err" id="lock-err" hidden>Incorrect password. Please try again.</div>
    </form>
  </div>
</div>

<!-- Main Family Tree App (Hidden until unlocked) -->
<div id="app" hidden>
  <header class="bar">
    <div class="title">
      <h1>My Family Tree</h1>
      <p class="stats" id="stats">Loading…</p>
    </div>
    <div class="tools">
      <span class="pill ok" id="status" role="status">View only</span>
      <div class="search">
        <input id="q" type="search" placeholder="Find a person" aria-label="Find a person" autocomplete="off">
        <span class="count" id="count"></span>
      </div>
      <div class="group" role="group" aria-label="Zoom">
        <button class="btn" data-act="zout" aria-label="Zoom out" title="Zoom out">−</button>
        <button class="btn" data-act="zin" aria-label="Zoom in" title="Zoom in">+</button>
      </div>
      <div class="group" role="group" aria-label="Branches">
        <button class="btn" data-act="expand">Expand</button>
        <button class="btn" data-act="collapse">Collapse</button>
      </div>
      <button class="btn" data-act="import" title="Preview or load a .ged file from your device">Load .ged</button>
      <button class="btn" data-act="export" title="Download current GEDCOM file">Export GEDCOM</button>
      <button class="btn" data-act="lock" title="Lock this page">🔒 Lock</button>
      <input id="ged-file-input" type="file" accept=".ged,.txt" hidden />
    </div>
  </header>
  <p class="notice" id="notice" hidden=""></p>
  <p class="stats" style="margin:10px 0 0">Tap a <b>+number</b> badge to open a branch, or choose Expand to open them all. Tap anyone to see their relatives.</p>
  <div class="layout">
    <main class="treewrap" id="treewrap" aria-label="Family tree">
      <div id="tree"></div>
    </main>
    <aside class="panel idle" id="panel" aria-live="polite"></aside>
  </div>
</div>

<script>
(() => {
  // Password verification config (SHA-256 of "memon1")
  const EXPECTED_HASH = '1b136dc04728b2d011828c4858b2773c070a231b24f4ea5be4279985f491b244';
  const SESSION_KEY = 'ft_unlocked_v1';

  // External GEDCOM filenames checked automatically on GitHub Pages (in priority order)
  const EXTERNAL_GED_FILES = [
    'family.ged',
    'my-family-tree.ged',
    'my-family-tree-gedcom.ged',
    'my-family-tree-gedcom.ged.txt'
  ];

  const lockscreenEl = document.getElementById('lockscreen');
  const lockCardEl = document.getElementById('lock-card');
  const lockFormEl = document.getElementById('lock-form');
  const pwInputEl = document.getElementById('pw-input');
  const pwToggleEl = document.getElementById('pw-toggle');
  const lockErrEl = document.getElementById('lock-err');

  const appEl = document.getElementById('app');
  const statsEl = document.getElementById('stats');
  const noticeEl = document.getElementById('notice');
  const treeEl = document.getElementById('tree');
  const treewrap = document.getElementById('treewrap');
  const panelEl = document.getElementById('panel');
  const searchInput = document.getElementById('q');
  const countEl = document.getElementById('count');
  const fileInputEl = document.getElementById('ged-file-input');

  let gedcomText = document.getElementById('gedcom-data').textContent.trim();
  let indis = new Map();
  let fams = new Map();
  let zoom = 1;
  let selectedId = null;
  let searchMatches = [];
  let searchIdx = 0;
  let locCycleIdx = 0;
  let isInitialized = false;

  // Compute SHA-256 hex digest (with fallback if Web Crypto is unavailable on file://)
  async function verifyPassword(input) {
    const cleaned = input.trim();
    if (window.crypto && window.crypto.subtle) {
      const buf = new TextEncoder().encode(cleaned);
      const hashBuf = await window.crypto.subtle.digest('SHA-256', buf);
      const hex = Array.from(new Uint8Array(hashBuf))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
      return hex === EXPECTED_HASH;
    }
    return cleaned === 'memon1';
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Parse GEDCOM 5.5.1 text into `indis` and `fams` Maps
  function parseGedcom(text) {
    const parsedIndis = new Map();
    const parsedFams = new Map();
    let current = null;
    let currentType = null;
    let subTag = null;

    const lines = text.split(/\r?\n/);
    for (const rawLine of lines) {
      const line = rawLine.trim();
      if (!line) continue;
      const m = line.match(/^(\d+)\s+(?:@([^@]+)@\s+)?(\S+)(?:\s+(.*))?$/);
      if (!m) continue;
      const level = parseInt(m[1], 10);
      const xref = m[2] || null;
      const tag = m[3];
      const val = (m[4] || '').trim();

      if (level === 0) {
        subTag = null;
        if (tag === 'INDI' && xref) {
          currentType = 'INDI';
          current = {
            id: xref,
            name: '',
            givn: '',
            surn: '',
            sex: '',
            dead: false,
            birtDate: '',
            deatDate: '',
            fams: [],
            famc: []
          };
          parsedIndis.set(xref, current);
        } else if (tag === 'FAM' && xref) {
          currentType = 'FAM';
          current = {
            id: xref,
            husb: null,
            wife: null,
            chil: [],
            current: true
          };
          parsedFams.set(xref, current);
        } else {
          current = null;
          currentType = null;
        }
      } else if (current && currentType === 'INDI') {
        if (level === 1) {
          subTag = tag;
          if (tag === 'NAME') {
            current.name = val.replace(/\//g, '').replace(/\s+/g, ' ').trim();
          } else if (tag === 'SEX') {
            current.sex = val;
          } else if (tag === 'DEAT') {
            current.dead = true;
          } else if (tag === 'FAMS') {
            const fid = val.replace(/@/g, '');
            if (fid) current.fams.push(fid);
          } else if (tag === 'FAMC') {
            const fid = val.replace(/@/g, '');
            if (fid) current.famc.push(fid);
          }
        } else if (level === 2) {
          if (tag === 'GIVN') current.givn = val;
          else if (tag === 'SURN') current.surn = val;
          else if (tag === 'DATE') {
            if (subTag === 'BIRT') current.birtDate = val;
            else if (subTag === 'DEAT') {
              current.dead = true;
              current.deatDate = val;
            }
          }
        }
      } else if (current && currentType === 'FAM') {
        if (level === 1) {
          const cleanId = val.replace(/@/g, '');
          if (tag === 'HUSB') current.husb = cleanId;
          else if (tag === 'WIFE') current.wife = cleanId;
          else if (tag === 'CHIL') current.chil.push(cleanId);
          else if (tag === '_CURRENT') current.current = (val !== 'N');
        }
      }
    }
    return { indis: parsedIndis, fams: parsedFams };
  }

  // Dynamically build the entire <ul class="roots">...</ul> HTML from parsed GEDCOM
  function buildTreeFromGedcom(indisMap, famsMap) {
    const hasParentFam = new Set();
    for (const fam of famsMap.values()) {
      if (fam.husb || fam.wife) {
        for (const cid of fam.chil) {
          if (indisMap.has(cid)) hasParentFam.add(cid);
        }
      }
    }

    const rootIds = [];
    const attachedRootSpouses = new Set();

    for (const [iid, p] of indisMap.entries()) {
      if (hasParentFam.has(iid) || attachedRootSpouses.has(iid)) continue;
      const spouses = [];
      for (const fid of p.fams) {
        const fam = famsMap.get(fid);
        if (!fam) continue;
        const sp = fam.husb === iid ? fam.wife : fam.husb;
        if (sp) spouses.push(sp);
      }
      if (spouses.some(sp => hasParentFam.has(sp) || rootIds.includes(sp))) {
        continue;
      }
      rootIds.push(iid);
      spouses.forEach(sp => attachedRootSpouses.add(sp));
    }

    const primaryNodes = new Set([...rootIds, ...hasParentFam]);
    const expandedFams = new Map();
    let maxGenDepth = 0;

    function renderPersonButton(iid, isRef = false, extraSmall = '') {
      const p = indisMap.get(iid);
      if (!p) return '';
      const classes = ['card'];
      if (p.sex === 'M') classes.push('m');
      else if (p.sex === 'F') classes.push('f');
      if (p.dead) classes.push('dead');
      if (isRef) classes.push('ref');

      const aria = p.dead ? `${p.name}, deceased` : p.name;
      const dag = p.dead ? '<span class="dag"> †</span>' : '';
      const small = extraSmall ? `<small>${escapeHtml(extraSmall)}</small>` : '';
      return `<button class="${classes.join(' ')}" data-act="pick" data-id="${escapeHtml(iid)}" aria-label="${escapeHtml(aria)}"><span class="dot"></span><span class="nm">${escapeHtml(p.name)}${dag}${small}</span></button>`;
    }

    function renderNode(iid, depth) {
      if (depth > maxGenDepth) maxGenDepth = depth;
      const p = indisMap.get(iid);
      if (!p) return '';

      const coupleParts = [renderPersonButton(iid, false)];
      const kidsToRender = [];

      for (const fid of p.fams) {
        const fam = famsMap.get(fid);
        if (!fam) continue;
        const spId = fam.husb === iid ? fam.wife : fam.husb;
        if (spId && indisMap.has(spId)) {
          const sp = indisMap.get(spId);
          const ended = !fam.current;
          const mlabelCls = ended ? 'mlabel ended' : 'mlabel';
          const mlabelTitle = ended ? 'Marriage ended' : 'Married';
          const isRef = primaryNodes.has(spId);

          const otherSpouses = [];
          for (const spFid of sp.fams) {
            if (spFid !== fid && famsMap.has(spFid)) {
              const spFam = famsMap.get(spFid);
              const osp = spFam.husb === spId ? spFam.wife : spFam.husb;
              if (osp && indisMap.has(osp)) {
                otherSpouses.push(indisMap.get(osp).name);
              }
            }
          }
          const extraSmall = otherSpouses.length ? `also m. ${otherSpouses.join(', ')}` : '';
          const spBtn = renderPersonButton(spId, isRef, extraSmall);
          coupleParts.push(`<div class="srow"><span class="${mlabelCls}" title="${mlabelTitle}">m.</span>${spBtn}</div>`);
        }

        const validChil = fam.chil.filter(c => indisMap.has(c));
        if (validChil.length > 0) {
          if (expandedFams.has(fid)) {
            const ownerId = expandedFams.get(fid);
            const ownerName = indisMap.get(ownerId)?.name || 'another branch';
            coupleParts.push(`<div class="note">Children are listed under ${escapeHtml(ownerName)}</div>`);
          } else {
            expandedFams.set(fid, iid);
            kidsToRender.push(...validChil);
          }
        }
      }

      const coupleHtml = `<div class="couple">${coupleParts.join('')}</div>`;
      if (kidsToRender.length > 0) {
        const togHtml = `<button class="tog" data-act="tog" data-id="${escapeHtml(iid)}" aria-expanded="true" aria-label="Hide descendants of ${escapeHtml(p.name)}">−</button>`;
        const unitHtml = `<div class="unit">${coupleHtml}${togHtml}</div>`;
        const kidsHtml = `<ul class="kids">${kidsToRender.map(cid => renderNode(cid, depth + 1)).join('')}</ul>`;
        return `<li class="node" data-node="${escapeHtml(iid)}">${unitHtml}${kidsHtml}</li>`;
      } else {
        const unitHtml = `<div class="unit">${coupleHtml}</div>`;
        return `<li class="node" data-node="${escapeHtml(iid)}">${unitHtml}</li>`;
      }
    }

    const treeHtml = `<ul class="roots">${rootIds.map(rid => renderNode(rid, 1)).join('')}</ul>`;
    return {
      treeHtml,
      peopleCount: indisMap.size,
      familyCount: famsMap.size,
      generations: maxGenDepth
    };
  }

  function loadGedcomAndRender(rawGedText, sourceLabel = '') {
    gedcomText = rawGedText.trim();
    const parsed = parseGedcom(gedcomText);
    indis = parsed.indis;
    fams = parsed.fams;

    const { treeHtml, peopleCount, familyCount, generations } = buildTreeFromGedcom(indis, fams);
    treeEl.innerHTML = treeHtml;
    statsEl.textContent = `${peopleCount} people · ${familyCount} families · ${generations} generations`;

    selectedId = null;
    searchInput.value = '';
    countEl.textContent = '';
    renderIdlePanel();

    if (sourceLabel) {
      showNotice(`Loaded ${sourceLabel} (${peopleCount} people, ${familyCount} families).`);
    }
  }

  function showNotice(msg) {
    noticeEl.innerHTML = `<span>${escapeHtml(msg)}</span><button class="btn" data-act="dismiss-notice" style="padding:2px 8px;font-size:0.75rem">Dismiss</button>`;
    noticeEl.hidden = false;
  }

  // Try fetching an external .ged file from the repo so updates on GitHub only require replacing the .ged file
  async function tryLoadExternalGedcom() {
    if (window.location.protocol === 'file:') return;
    for (const filename of EXTERNAL_GED_FILES) {
      try {
        const res = await fetch(`${filename}?v=${Date.now()}`, { cache: 'no-store' });
        if (res.ok) {
          const text = await res.text();
          if (text && text.includes('0 HEAD') && text.includes('INDI')) {
            loadGedcomAndRender(text);
            return;
          }
        }
      } catch (_) {
        // Ignore fetch errors and continue to fallback
      }
    }
  }

  function getBranchCount(nodeLi) {
    const kidsUl = nodeLi.querySelector(':scope > ul.kids');
    if (!kidsUl) return 0;
    return kidsUl.querySelectorAll('li.node').length;
  }

  function getPrimaryPersonName(nodeLi) {
    const firstCard = nodeLi.querySelector(':scope > .unit .couple button.card');
    if (!firstCard) return 'branch';
    const id = firstCard.getAttribute('data-id');
    const p = indis.get(id);
    return p ? p.name : firstCard.textContent.replace('†', '').trim();
  }

  function setNodeExpanded(nodeLi, expanded) {
    const togBtn = nodeLi.querySelector(':scope > .unit > button.tog');
    if (!togBtn) return;
    const count = getBranchCount(nodeLi);
    const name = getPrimaryPersonName(nodeLi);
    if (expanded) {
      nodeLi.classList.remove('collapsed');
      togBtn.setAttribute('aria-expanded', 'true');
      togBtn.setAttribute('aria-label', `Hide descendants of ${name}`);
      togBtn.textContent = '−';
    } else {
      nodeLi.classList.add('collapsed');
      togBtn.setAttribute('aria-expanded', 'false');
      togBtn.setAttribute('aria-label', `Show ${count} descendants of ${name}`);
      togBtn.textContent = `+${count}`;
    }
  }

  function renderIdlePanel() {
    panelEl.classList.add('idle');
    panelEl.innerHTML = `
      <h2>Family details</h2>
      <p class="guide">Select anyone in the tree to see their parents, spouses, children and siblings.</p>
      <p class="guide"><b>Updating the tree:</b> Upload a <code>family.ged</code> file to your GitHub repo (or paste new GEDCOM text into <code>index.html</code>), or use <b>Load .ged</b> above to preview a file immediately.</p>
      <div class="legend">
        <span><i style="background:var(--male)"></i>Male</span>
        <span><i style="background:var(--female)"></i>Female</span>
        <span>† Deceased</span>
        <span>↗ Also appears in their own family above</span>
      </div>
    `;
  }

  function createPersonCardHTML(id, subNote = '') {
    const p = indis.get(id);
    if (!p) return '';
    const sexClass = p.sex === 'F' ? 'f' : 'm';
    const deadClass = p.dead ? ' dead' : '';
    const dagHTML = p.dead ? '<span class="dag"> †</span>' : '';
    const aria = p.dead ? `${p.name}, deceased` : p.name;
    return `
      <div class="rel-item">
        <button class="card ${sexClass}${deadClass}" data-act="pick" data-id="${escapeHtml(p.id)}" aria-label="${escapeHtml(aria)}">
          <span class="dot"></span>
          <span class="nm">${escapeHtml(p.name)}${dagHTML}</span>
          ${subNote ? `<span class="rel-sub">${escapeHtml(subNote)}</span>` : ''}
        </button>
      </div>
    `;
  }

  function renderPersonPanel(id) {
    const p = indis.get(id);
    if (!p) {
      renderIdlePanel();
      return;
    }
    panelEl.classList.remove('idle');

    // Parents
    const parents = [];
    for (const fid of p.famc) {
      const fam = fams.get(fid);
      if (!fam) continue;
      if (fam.husb && indis.has(fam.husb)) parents.push({ id: fam.husb, role: 'Father' });
      if (fam.wife && indis.has(fam.wife)) parents.push({ id: fam.wife, role: 'Mother' });
    }

    // Spouses & Children
    const spouses = [];
    const children = [];
    const seenChildren = new Set();
    for (const fid of p.fams) {
      const fam = fams.get(fid);
      if (!fam) continue;
      const partnerId = fam.husb === p.id ? fam.wife : fam.husb;
      if (partnerId && indis.has(partnerId)) {
        spouses.push({
          id: partnerId,
          status: fam.current ? 'Married' : 'Marriage ended'
        });
      }
      for (const cid of fam.chil) {
        if (!seenChildren.has(cid) && indis.has(cid)) {
          seenChildren.add(cid);
          const partnerName = partnerId && indis.has(partnerId) ? indis.get(partnerId).name : '';
          children.push({
            id: cid,
            withPartner: p.fams.length > 1 && partnerName ? `with ${partnerName}` : ''
          });
        }
      }
    }

    // Siblings (full & half)
    const siblings = [];
    const seenSibs = new Set([p.id]);
    for (const fid of p.famc) {
      const fam = fams.get(fid);
      if (!fam) continue;
      for (const sid of fam.chil) {
        if (!seenSibs.has(sid) && indis.has(sid)) {
          seenSibs.add(sid);
          siblings.push({ id: sid, note: '' });
        }
      }
    }
    for (const par of parents) {
      const parObj = indis.get(par.id);
      if (!parObj) continue;
      for (const fid of parObj.fams) {
        if (p.famc.includes(fid)) continue;
        const fam = fams.get(fid);
        if (!fam) continue;
        for (const sid of fam.chil) {
          if (!seenSibs.has(sid) && indis.has(sid)) {
            seenSibs.add(sid);
            siblings.push({ id: sid, note: 'Half-sibling' });
          }
        }
      }
    }

    const sexLabel = p.sex === 'F' ? 'Female' : (p.sex === 'M' ? 'Male' : 'Unknown');
    const sexClass = p.sex === 'F' ? 'f' : 'm';

    const metaRows = [];
    if (p.birtDate) {
      metaRows.push(`<div><dt>Born</dt><dd>${escapeHtml(p.birtDate)}</dd></div>`);
    }
    if (p.dead) {
      metaRows.push(`<div><dt>Status</dt><dd>${p.deatDate ? 'Deceased · ' + escapeHtml(p.deatDate) : 'Deceased †'}</dd></div>`);
    } else {
      metaRows.push(`<div><dt>Status</dt><dd>Living</dd></div>`);
    }

    const treeCards = treeEl.querySelectorAll(`button.card[data-id="${CSS.escape(p.id)}"]`);

    panelEl.innerHTML = `
      <div class="p-head">
        <div>
          <h2 class="p-name">${escapeHtml(p.name)}${p.dead ? ' <span class="dag">†</span>' : ''}</h2>
          <div class="p-badges">
            <span class="badge ${sexClass}">${sexLabel}</span>
            ${p.dead ? '<span class="badge">Deceased</span>' : '<span class="badge">Living</span>'}
          </div>
        </div>
        <button class="btn" data-act="clear-pick" aria-label="Close details" title="Close details">✕</button>
      </div>

      <dl class="p-meta" style="margin:0">
        ${metaRows.join('')}
      </dl>

      ${treeCards.length > 1 ? `
        <button class="btn" data-act="cycle-loc" data-id="${escapeHtml(p.id)}" style="width:100%">
          ↗ Jump between ${treeCards.length} locations in tree
        </button>
      ` : ''}

      <div class="rel-sec">
        <h3>Parents (${parents.length})</h3>
        ${parents.length
          ? `<div class="rel-list">${parents.map(r => createPersonCardHTML(r.id, r.role)).join('')}</div>`
          : `<div class="empty-rel">None listed in tree</div>`}
      </div>

      <div class="rel-sec">
        <h3>Spouses (${spouses.length})</h3>
        ${spouses.length
          ? `<div class="rel-list">${spouses.map(s => createPersonCardHTML(s.id, s.status)).join('')}</div>`
          : `<div class="empty-rel">None listed in tree</div>`}
      </div>

      <div class="rel-sec">
        <h3>Children (${children.length})</h3>
        ${children.length
          ? `<div class="rel-list">${children.map(c => createPersonCardHTML(c.id, c.withPartner)).join('')}</div>`
          : `<div class="empty-rel">None listed in tree</div>`}
      </div>

      <div class="rel-sec">
        <h3>Siblings (${siblings.length})</h3>
        ${siblings.length
          ? `<div class="rel-list">${siblings.map(s => createPersonCardHTML(s.id, s.note)).join('')}</div>`
          : `<div class="empty-rel">None listed in tree</div>`}
      </div>
    `;
  }

  function expandAncestorsOf(el) {
    let curr = el.closest('li.node');
    while (curr) {
      const parentNode = curr.parentElement ? curr.parentElement.closest('li.node') : null;
      if (parentNode && parentNode.classList.contains('collapsed')) {
        setNodeExpanded(parentNode, true);
      }
      curr = parentNode;
    }
  }

  function selectPerson(id, { scroll = true, cycle = false } = {}) {
    selectedId = id;
    treeEl.querySelectorAll('button.card.selected').forEach(btn => btn.classList.remove('selected'));

    if (!id) {
      renderIdlePanel();
      return;
    }

    const cards = Array.from(treeEl.querySelectorAll(`button.card[data-id="${CSS.escape(id)}"]`));
    cards.forEach(c => c.classList.add('selected'));

    if (cards.length > 0) {
      if (cycle) {
        locCycleIdx = (locCycleIdx + 1) % cards.length;
      } else {
        const primaryIdx = cards.findIndex(c => !c.classList.contains('ref'));
        locCycleIdx = primaryIdx >= 0 ? primaryIdx : 0;
      }
      const targetCard = cards[locCycleIdx];
      expandAncestorsOf(targetCard);
      if (scroll) {
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
      }
    }

    renderPersonPanel(id);
  }

  function setZoom(newZoom) {
    zoom = Math.min(1.6, Math.max(0.5, Math.round(newZoom * 10) / 10));
    document.documentElement.style.setProperty('--zoom', zoom);
  }

  function exportGedcom() {
    const blob = new Blob([gedcomText + '\n'], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'family.ged';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function handleGedFileObject(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const text = String(reader.result || '');
      if (!text.includes('INDI')) {
        showNotice('That file does not appear to be a valid GEDCOM (.ged) file.');
        return;
      }
      loadGedcomAndRender(text, file.name);
    };
    reader.readAsText(file);
  }

  function unlockApp() {
    sessionStorage.setItem(SESSION_KEY, '1');
    lockscreenEl.hidden = true;
    appEl.hidden = false;
    lockErrEl.hidden = true;
    pwInputEl.value = '';

    if (!isInitialized) {
      isInitialized = true;
      loadGedcomAndRender(gedcomText);
      tryLoadExternalGedcom();
    }
  }

  function lockApp() {
    sessionStorage.removeItem(SESSION_KEY);
    appEl.hidden = true;
    lockscreenEl.hidden = false;
    pwInputEl.value = '';
    setTimeout(() => pwInputEl.focus(), 50);
  }

  // Password form events
  pwToggleEl.addEventListener('click', () => {
    const isPw = pwInputEl.type === 'password';
    pwInputEl.type = isPw ? 'text' : 'password';
    pwToggleEl.textContent = isPw ? 'Hide' : 'Show';
    pwToggleEl.setAttribute('aria-label', isPw ? 'Hide password' : 'Show password');
    pwInputEl.focus();
  });

  lockFormEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    const ok = await verifyPassword(pwInputEl.value);
    if (ok) {
      unlockApp();
    } else {
      lockErrEl.hidden = false;
      lockCardEl.classList.remove('shake');
      void lockCardEl.offsetWidth;
      lockCardEl.classList.add('shake');
      pwInputEl.select();
    }
  });

  // Main app click actions
  appEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.getAttribute('data-act');

    if (act === 'pick') {
      const id = btn.getAttribute('data-id');
      const inTree = treeEl.contains(btn);
      if (inTree) {
        treeEl.querySelectorAll('button.card.selected').forEach(b => b.classList.remove('selected'));
        treeEl.querySelectorAll(`button.card[data-id="${CSS.escape(id)}"]`).forEach(b => b.classList.add('selected'));
        selectedId = id;
        renderPersonPanel(id);
      } else {
        selectPerson(id, { scroll: true });
      }
    } else if (act === 'clear-pick') {
      selectPerson(null);
    } else if (act === 'cycle-loc') {
      const id = btn.getAttribute('data-id');
      selectPerson(id, { scroll: true, cycle: true });
    } else if (act === 'tog') {
      const nodeLi = btn.closest('li.node');
      if (nodeLi) {
        const isExpanded = btn.getAttribute('aria-expanded') === 'true';
        setNodeExpanded(nodeLi, !isExpanded);
      }
    } else if (act === 'expand') {
      treeEl.querySelectorAll('li.node').forEach(nodeLi => setNodeExpanded(nodeLi, true));
    } else if (act === 'collapse') {
      treeEl.querySelectorAll('li.node').forEach(nodeLi => {
        if (nodeLi.querySelector(':scope > ul.kids')) {
          setNodeExpanded(nodeLi, false);
        }
      });
    } else if (act === 'zin') {
      setZoom(zoom + 0.1);
    } else if (act === 'zout') {
      setZoom(zoom - 0.1);
    } else if (act === 'import') {
      fileInputEl.click();
    } else if (act === 'export') {
      exportGedcom();
    } else if (act === 'lock') {
      lockApp();
    } else if (act === 'dismiss-notice') {
      noticeEl.hidden = true;
    }
  });

  fileInputEl.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) handleGedFileObject(file);
    fileInputEl.value = '';
  });

  // Drag and drop a .ged file anywhere on #app
  appEl.addEventListener('dragover', (e) => {
    e.preventDefault();
    appEl.classList.add('dragover');
  });

  appEl.addEventListener('dragleave', (e) => {
    if (!appEl.contains(e.relatedTarget)) {
      appEl.classList.remove('dragover');
    }
  });

  appEl.addEventListener('drop', (e) => {
    e.preventDefault();
    appEl.classList.remove('dragover');
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) handleGedFileObject(file);
  });

  // Search handling
  function runSearch(query) {
    treeEl.querySelectorAll('button.card.match').forEach(b => b.classList.remove('match'));
    searchMatches = [];
    searchIdx = 0;

    const q = query.trim().toLowerCase();
    if (!q) {
      countEl.textContent = '';
      return;
    }

    const matchedIds = new Set();
    for (const [id, p] of indis.entries()) {
      if (p.name.toLowerCase().includes(q)) {
        matchedIds.add(id);
      }
    }

    if (matchedIds.size === 0) {
      countEl.textContent = '0';
      return;
    }

    matchedIds.forEach(id => {
      const cards = Array.from(treeEl.querySelectorAll(`button.card[data-id="${CSS.escape(id)}"]`));
      cards.forEach(c => {
        c.classList.add('match');
        expandAncestorsOf(c);
      });
      const primary = cards.find(c => !c.classList.contains('ref')) || cards[0];
      if (primary) searchMatches.push({ id, card: primary });
    });

    countEl.textContent = `${searchMatches.length} found`;
    if (searchMatches.length > 0) {
      const first = searchMatches[0];
      selectPerson(first.id, { scroll: true });
    }
  }

  searchInput.addEventListener('input', (e) => {
    runSearch(e.target.value);
  });

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && searchMatches.length > 0) {
      e.preventDefault();
      searchIdx = (searchIdx + 1) % searchMatches.length;
      const target = searchMatches[searchIdx];
      countEl.textContent = `${searchIdx + 1} / ${searchMatches.length}`;
      selectPerson(target.id, { scroll: true });
    } else if (e.key === 'Escape') {
      searchInput.value = '';
      runSearch('');
    }
  });

  // Click-and-drag panning on treewrap
  let isPanning = false;
  let startX = 0, startY = 0, scrollL = 0, scrollT = 0;

  treewrap.addEventListener('mousedown', (e) => {
    if (e.target.closest('button, input, a')) return;
    isPanning = true;
    treewrap.classList.add('panning');
    startX = e.pageX - treewrap.offsetLeft;
    startY = e.pageY - treewrap.offsetTop;
    scrollL = treewrap.scrollLeft;
    scrollT = treewrap.scrollTop;
  });

  window.addEventListener('mousemove', (e) => {
    if (!isPanning) return;
    e.preventDefault();
    const x = e.pageX - treewrap.offsetLeft;
    const y = e.pageY - treewrap.offsetTop;
    treewrap.scrollLeft = scrollL - (x - startX);
    treewrap.scrollTop = scrollT - (y - startY);
  });

  window.addEventListener('mouseup', () => {
    isPanning = false;
    treewrap.classList.remove('panning');
  });

  // Auto-unlock if already authenticated in the current browser tab session
  if (sessionStorage.getItem(SESSION_KEY) === '1') {
    unlockApp();
  }
})();
</script>
</body>
</html>
